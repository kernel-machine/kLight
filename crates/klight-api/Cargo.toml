[package]
name = "klight-api"
description = "Client protocol (typed JSON messages) and the WebSocket server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Export TypeScript bindings: `cargo test -p klight-api --features ts export_bindings`
ts = ["dep:ts-rs", "klight-model/ts"]

[dependencies]
klight-model.workspace = true
klight-engine-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
futures-util.workspace = true
crossbeam-channel.workspace = true
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
tokio-tungstenite = "0.27"
proptest.workspace = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
