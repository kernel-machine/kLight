[package]
name = "klight-wasm"
description = "Pure core functions compiled to WebAssembly for the UI (previews, patch helpers): one implementation shared by engine and UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
klight-model.workspace = true
klight-engine-core.workspace = true
serde.workspace = true
serde_json.workspace = true
# JS bindings (MIT/Apache-2.0). Keep in sync with the wasm-bindgen CLI version (README).
wasm-bindgen = "=0.2.130"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
