[package]
name = "klight-sim"
description = "Deterministic simulator: scenarios, golden tests, chaos and soak harness."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
klight-model.workspace = true
klight-fixtures.workspace = true
klight-engine-core.workspace = true
klight-io.workspace = true
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true

# Soak test: the tick thread's CPU time (thread CPU clock) and voluntary
# context switches (getrusage per thread), through safe wrappers; nix is
# already in the dependency tree (MIT).
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.26", default-features = false, features = ["resource", "time"] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
klight-persist.workspace = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
