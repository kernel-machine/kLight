# with it. Permissive licenses and MPL-2.0 are; GPL-2.0-only and anything
# non-free are not.
[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "Zlib", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "BSL-1.0", "MPL-2.0", "GPL-3.0-or-later"]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
