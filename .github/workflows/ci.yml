name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * *" # nightly: long soak + fuzzing

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: QLC+ fixture library (downloaded, not versioned)
        shell: bash
        run: sh scripts/update-qlcplus-fixtures.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: QLC+ fixture library (downloaded, not versioned)
        run: sh scripts/update-qlcplus-fixtures.sh
      - name: wasm-bindgen CLI (same version as the crate)
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - name: Generated TypeScript bindings are up to date
        run: npm run bindings && git diff --exit-code -- src/lib/protocol
        working-directory: ui
      - run: npm run check
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: cargo build -p klight-engine
      - run: npx playwright install --with-deps chromium && npm run e2e
        working-directory: ui

  soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Soak (30 min on PRs, 24 h nightly)
        run: cargo run -p klight-sim --release --bin klight-soak -- --minutes ${{ github.event_name == 'schedule' && '1440' || '30' }}
        timeout-minutes: 1500

  fuzz:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [qxf, show_file, api_message, osc, midi]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=600
        working-directory: fuzz

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
